<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Niraj Coaching Classes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#dce5f1;font-family:Arial,Segoe UI,sans-serif;color:#26364c}.login-card{width:min(100%,430px);padding:34px 30px 28px;border-radius:28px;background:#dce5f1;box-shadow:18px 18px 42px #bac4d1,-18px -18px 42px #fff;text-align:center}.portal-title{margin:0 0 22px;color:#2477b8;font-size:34px}.logo{width:58px;height:58px;object-fit:contain;margin:8px auto 12px}.school{margin:0;font-size:21px}.subtitle{margin:8px 0 26px;color:#6c7d96;font-size:14px;font-weight:700;letter-spacing:3px}.field{width:100%;height:49px;margin:7px 0;padding:0 18px;border:0;border-radius:28px;background:#e5edf8;box-shadow:inset 5px 5px 10px #c3cbd6,inset -5px -5px 10px #fff;font-size:14px;outline:none}.action{width:100%;min-height:49px;margin-top:14px;border:0;border-radius:28px;background:#dce5f1;box-shadow:7px 7px 15px #bac4d1,-7px -7px 15px #fff;color:#1684bd;font-size:15px;font-weight:700;cursor:pointer}.message{min-height:22px;margin:16px 0 0;font-size:14px;color:#52657a}.help{margin:16px 0 0;color:#6c7d96;font-size:13px}
</style>
</head>
<body>
<main class="login-card">
<h1 class="portal-title">Student Portal</h1>
<img class="logo" src="logo.png" alt="Niraj Coaching Classes">
<h2 class="school">Niraj Coaching Classes</h2>
<p class="subtitle">STUDENT SIGN IN</p>
<form id="studentLoginForm">
<input class="field" id="studentMobile" type="text" inputmode="text" autocomplete="username" placeholder="Registered mobile number or email" required>
<input class="field" id="studentPassword" type="password" autocomplete="current-password" placeholder="Password" required>
<button class="action" id="loginButton" type="submit">Student Login</button>
</form>
<p class="message" id="loginMessage" role="status" aria-live="polite"></p>
<p class="help">Password ke liye coaching admin se sampark karein.</p>
</main>
<script>
const supabaseClient=window.supabase.createClient("https://licsmghlaxqptmzybavp.supabase.co","sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZkEeW50");
const form=document.getElementById("studentLoginForm");
const message=document.getElementById("loginMessage");
const loginButton=document.getElementById("loginButton");
form.addEventListener("submit",async function(event){
event.preventDefault();
const entered=document.getElementById("studentMobile").value.trim();
let email=entered;
if(!entered.includes("@")){
let mobile=entered.replace(/\D/g,"");
if(/^91\d{10}$/.test(mobile)) mobile=mobile.slice(2);
if(!/^\d{10}$/.test(mobile)){
message.style.color="#c6283d";message.textContent="Registered 10 digit mobile number ya email enter karein.";return;
}
email="student-"+mobile+"@nirajcoachingclasses.example.com";
}
message.style.color="#52657a";message.textContent="Login ho raha hai...";
loginButton.disabled=true;
try{
const {error}=await supabaseClient.auth.signInWithPassword({email,password:document.getElementById("studentPassword").value});
if(error){message.style.color="#c6283d";message.textContent="Login failed: registered mobile/email aur password check karein.";return;}
window.location.href="student-dashboard.html";
}catch(error){
message.style.color="#c6283d";message.textContent="Login nahi ho saka. Internet connection check karke phir koshish karein.";
}finally{loginButton.disabled=false;}
});
</script>
</body>
</html>
