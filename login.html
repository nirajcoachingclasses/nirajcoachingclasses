<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Niraj Coaching Classes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#dce5f1;font-family:Arial,Segoe UI,sans-serif;color:#26364c}.login-card{width:min(100%,430px);padding:34px 30px 28px;border-radius:28px;background:#dce5f1;box-shadow:18px 18px 42px #bac4d1,-18px -18px 42px #fff;text-align:center}.portal-title{margin:0 0 22px;color:#c43b50;font-size:34px}.logo{width:58px;height:58px;object-fit:contain;margin:8px auto 12px}.school{margin:0;font-size:21px}.subtitle{margin:8px 0 26px;color:#6c7d96;font-size:14px;font-weight:700;letter-spacing:3px}.field{width:100%;height:49px;margin:7px 0;padding:0 18px;border:0;border-radius:28px;background:#e5edf8;box-shadow:inset 5px 5px 10px #c3cbd6,inset -5px -5px 10px #fff;font-size:14px;outline:none}.action{width:100%;min-height:49px;margin-top:14px;border:0;border-radius:28px;background:#dce5f1;box-shadow:7px 7px 15px #bac4d1,-7px -7px 15px #fff;color:#1684bd;font-size:15px;font-weight:700;cursor:pointer}.action:hover{color:#0b669a}.link-action{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:28px;background:#dce5f1;box-shadow:7px 7px 15px #bac4d1,-7px -7px 15px #fff;color:#1684bd;font-size:15px;font-weight:700;cursor:pointer}.message{min-height:22px;margin:16px 0 0;font-size:14px;color:#52657a}
.student-login-link{display:inline-block;margin-top:22px;color:#1678b8;font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main class="login-card">
  <h1 class="portal-title">Admin Portal</h1>
  <img class="logo" src="logo.png" alt="Niraj Coaching Classes">
  <h2 class="school">Niraj Coaching Classes</h2>
  <p class="subtitle">SIGN IN</p>
  <form id="adminLoginForm">
    <input class="field" id="adminEmail" type="email" autocomplete="username" placeholder="Admin email" required>
    <input class="field" id="adminPassword" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="action" type="submit">Admin Login</button>
  </form>
  <button class="link-action" id="forgotPasswordButton" type="button">Forgot password?</button>
  <p class="message" id="loginMessage" role="status" aria-live="polite"></p>
  <p style="margin:18px 0 0;color:#6c7d96;font-size:14px">Student हैं? <a class="student-login-link" href="student-login.html">Student Login खोलें</a></p>
<p style="margin:18px 0 0;color:#6c7d96;font-size:14px">
  Parents हैं?
  <a class="student-login-link" href="parents-login.html">Parents Login खोलें</a>
</p>
</main>
<script>
const supabaseClient=window.supabase.createClient("https://licsmghlaxqptmzybavp.supabase.co","sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZkEeW50");
const message=document.getElementById("loginMessage");
document.getElementById("adminLoginForm").addEventListener("submit",async function(event){
  event.preventDefault();
  message.style.color="#52657a"; message.textContent="Admin login ho raha hai...";
  const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("adminEmail").value.trim(),password:document.getElementById("adminPassword").value});
  if(error){message.style.color="#c6283d";message.textContent="Login failed: "+error.message;return;}
  window.location.href="dashboard.html";
});
document.getElementById("forgotPasswordButton").addEventListener("click",async function(){
  const email=document.getElementById("adminEmail").value.trim();
  if(!email){message.style.color="#c6283d";message.textContent="Pehle admin email likhein.";return;}
  message.style.color="#52657a";message.textContent="Password reset email bheja ja raha hai...";
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email);
  if(error){message.style.color="#c6283d";message.textContent="Reset email nahi bheja ja saka: "+error.message;return;}
  message.style.color="#16804a";message.textContent="Password reset email bhej diya gaya hai.";
});
</script>
</body>
</html>
