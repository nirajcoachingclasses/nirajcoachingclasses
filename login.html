<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dce3ed">
    <title>Admin Login - Niraj Coaching Classes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            color-scheme: light;
            --surface: #dce3ed;
            --ink: #26354a;
            --muted: #68778d;
            --blue: #1685bd;
            --shadow-dark: #b8c0ce;
            --shadow-light: #fff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        .page {
            width: min(100%, 580px);
            text-align: center;
            animation: appear .8s ease-out both;
        }

        .brand {
            margin: 0 0 30px;
            color: #b72e43;
            font-size: clamp(1.55rem, 5vw, 2.2rem);
            font-weight: 750;
            letter-spacing: -.035em;
            text-shadow: 0 1px 0 #fff;
        }

        .login-box {
            position: relative;
            isolation: isolate;
            width: min(100%, 430px);
            aspect-ratio: 1;
            margin: 0 auto;
            padding: clamp(34px, 9vw, 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: 18px 18px 38px var(--shadow-dark), -18px -18px 38px var(--shadow-light), inset 1px 1px 2px #ffffff80;
            animation: float-in 1s cubic-bezier(.2,.8,.2,1) both, breathe 7s ease-in-out 1s infinite;
        }

        .logo {
            width: 68px;
            height: 54px;
            margin: 0 0 9px;
            object-fit: contain;
            animation: appear .8s .25s both;
        }

        h1 {
            margin: 0 0 5px;
            font-size: clamp(1rem, 3vw, 1.25rem);
            font-weight: 700;
        }

        h2 {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: .9rem;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        form { width: 100%; max-width: 280px; }

        input {
            display: block;
            width: 100%;
            min-height: 48px;
            margin: 12px 0;
            padding: 0 18px;
            border: 0;
            border-radius: 999px;
            outline: none;
            color: var(--ink);
            background: var(--surface);
            box-shadow: inset 6px 6px 11px var(--shadow-dark), inset -6px -6px 11px var(--shadow-light);
            font: inherit;
            transition: box-shadow .2s, transform .2s;
        }

        input::placeholder { color: #7b8799; opacity: 1; }
        input:focus { box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light), 0 0 0 3px #1685bd24; }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 12px;
            border: 0;
            border-radius: 999px;
            color: var(--blue);
            background: var(--surface);
            box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, color .2s ease;
        }

        button:hover { color: #096c9f; transform: translateY(-2px); }
        button:active { transform: translateY(1px); box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light); }
        button:focus-visible { outline: 3px solid #1685bd88; outline-offset: 5px; }
        button:disabled { cursor: wait; opacity: .7; }

        #message {
            min-height: 20px;
            margin-top: 12px;
            color: var(--muted);
            font-size: .82rem;
            line-height: 1.4;
        }

        @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
        @keyframes float-in { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes breathe { 0%, 100% { box-shadow: 18px 18px 38px var(--shadow-dark), -18px -18px 38px var(--shadow-light), inset 1px 1px 2px #ffffff80; } 50% { box-shadow: 22px 22px 44px #b8c0cecc, -22px -22px 44px #ffffff, inset 1px 1px 2px #ffffff80; } }

        @media (max-width: 480px) {
            body { padding: 26px 18px; }
            .brand { margin-bottom: 26px; }
            .login-box { width: min(100%, 380px); padding: 38px; }
            .logo { width: 54px; height: 42px; margin-bottom: 6px; }
            h2 { margin-bottom: 16px; }
            input { min-height: 44px; margin: 10px 0; }
            button { min-height: 46px; margin-top: 10px; }
        }

        @media (max-width: 350px) {
            .login-box { padding: 30px; }
            .brand { margin-bottom: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page">
        <p class="brand">Admin Portal</p>

        <section class="login-box" aria-labelledby="login-title">
            <img class="logo" src="logo.png" alt="Niraj Coaching Classes logo" onerror="this.hidden=true">
            <h1>Niraj Coaching Classes</h1>
            <h2 id="login-title">Sign In</h2>

            <form id="loginForm" onsubmit="adminLogin(); return false;">
                <input type="email" id="email" placeholder="Admin Email" aria-label="Admin email" autocomplete="username" required>
                <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
                <button id="loginButton" type="submit">Login</button>
                <div id="message" role="status" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <script>
        const SUPABASE_URL = "https://licsmghlaxqptmzybavp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZkEeW50";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function adminLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
            const button = document.getElementById("loginButton");

            if (!email || !password) {
                message.style.color = "#b42318";
                message.textContent = "Email और Password भरिए।";
                return;
            }

            button.disabled = true;
            message.style.color = "#68778d";
            message.textContent = "Login हो रहा है...";

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                button.disabled = false;
                message.style.color = "#b42318";
                message.textContent = "Login failed: " + error.message;
                return;
            }

            message.style.color = "#16804a";
            message.textContent = "Login successful!";
            setTimeout(function () {
                window.location.href = "dashboard.html";
            }, 800);
        }
    </script>
</body>
</html>
