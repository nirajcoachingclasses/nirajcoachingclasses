async function checkLogin(){

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if(!session){

        window.location.href = "login.html";
        return;
    }

    loadStudents();
}

async function loadFeeHistory(){

    const body = document.getElementById("feeHistoryBody");

    if(!body) return;

    body.innerHTML =
        '<tr><td colspan="6" style="padding:15px;text-align:center;">Loading...</td></tr>';

    const { data, error } = await supabaseClient
        .from("Fees")
        .select("*")
        .order("fee_month", { ascending:false });

    if(error){
        body.innerHTML =
            '<tr><td colspan="6" style="padding:15px;text-align:center;">' +
            error.message +
            '</td></tr>';
        return;
    }

    if(!data || data.length === 0){
        body.innerHTML =
            '<tr><td colspan="6" style="padding:15px;text-align:center;">No fee records</td></tr>';
        return;
    }

    body.innerHTML = "";

    data.forEach(function(fee){

        const student = students.find(
            s => String(s.id) === String(fee.student_id)
        );

        const row = document.createElement("tr");

        row.innerHTML = `
            <td style="padding:10px;">${student ? student.Student_name : "Unknown"}</td>
            <td style="padding:10px;">${fee.fee_month || ""}</td>
            <td style="padding:10px;">₹${fee.monthly_fee || 0}</td>
            <td style="padding:10px;">₹${fee.amount_paid || 0}</td>
            <td style="padding:10px;">₹${fee.due_fee || 0}</td>
            <td style="padding:10px;">${fee.payment_date || ""}</td>
        `;

        body.appendChild(row);
    });
}
async function loadStudents(){

    const status =
        document.getElementById("status");

    status.textContent =
        "Loading students...";

    const { data, error } =
        await supabaseClient
        .from("Student")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if(error){

        console.error(error);

        status.textContent =
            "Error: " + error.message;

        return;
    }

    students = data || [];

displayStudents(students);
populateFeeStudents();
loadFeeHistory();
    
    status.textContent =
        "Total Students: " + students.length;
}


async function getPhotoUrl(path){

    if(!path) return "";

    const { data, error } =
        await supabaseClient.storage
        .from("student_photos")
        .createSignedUrl(path, 3600);

    if(error){
        console.error(error);
        return "";
    }

    return data.signedUrl;
}


async function displayStudents(list){

    const tbody =
        document.getElementById("studentList");

    tbody.innerHTML = "";

    if(list.length === 0){

        tbody.innerHTML =
        `<tr>
            <td colspan="7" class="empty">
                No students found
            </td>
        </tr>`;

        return;
    }

    for(const student of list){

        const photo =
            await getPhotoUrl(student.Photo_url);

        const tr =
        document.createElement("tr");

        tr.innerHTML = `

            <td>
                ${
                    photo
                    ?
                    `<img
                        src="${photo}"
                        class="student-photo"
                    >`
                    :
                    "No Photo"
                }
            </td>

            <td>${student.Student_name || ""}</td>

            <td>${student.Father_name || ""}</td>

            <td>${student.Mobile_number || ""}</td>

            <td>${student["Student class"] || ""}</td>

            <td>${student.Address || ""}</td>

            <td>

                <button
    class="edit"
    onclick="window.editStudent('${student.id}')">
    Edit
</button>

                <button
                    class="delete"
                   onclick="window.deleteStudent('${student.id}')"> 
                    Delete
                </button>

            </td>
        `;

        tbody.appendChild(tr);
    }
}


document
.getElementById("search")
.addEventListener("input", function(){

    const q =
        this.value.toLowerCase().trim();

    const filtered =
        students.filter(s =>

            (s.Student_name || "")
            .toLowerCase()
            .includes(q)

            ||

            (s.Father_name || "")
            .toLowerCase()
            .includes(q)

            ||

            (s.Mobile_number || "")
            .toLowerCase()
            .includes(q)
        );

    displayStudents(filtered);
});


async function editStudent(id){

  const student = students.find(s => String(s.id) === String(id));  

    if(!student) return;

    const name = prompt(
        "Student Name:",
        student.Student_name || ""
    );

    if(name === null) return;

    const father = prompt(
        "Father Name:",
        student.Father_name || ""
    );

    if(father === null) return;

    const mobile = prompt(
        "Mobile Number:",
        student.Mobile_number || ""
    );

    if(mobile === null) return;

    const studentClass = prompt(
        "Class:",
        student["Student class"] || ""
    );

    if(studentClass === null) return;

    const address = prompt(
        "Address:",
        student.Address || ""
    );

    if(address === null) return;

    const { error } = await supabaseClient
        .from("Student")
        .update({
            Student_name: name,
            Father_name: father,
            Mobile_number: mobile,
            "Student class": studentClass,
            Address: address
        })
        .eq("id", id);

    if(error){

        alert(
            "Update failed: " +
            error.message
        );

        return;
    }

    alert("Student updated successfully!");

    loadStudents();
}

async function deleteStudent(id){

   const student =
    students.find(s => String(s.id) === String(id));
    if(!student) return;

    const confirmDelete =
        confirm(
            "Delete student " +
            (student.Student_name || "") +
            "?"
        );

    if(!confirmDelete) return;

    const { error } =
        await supabaseClient
        .from("Student")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }

    alert("Student deleted successfully!");

    loadStudents();
}

let currentEditId = null;

window.editStudent = function(id){

    const student = students.find(s => String(s.id) === String(id));

    if(!student) return;

    currentEditId = id;

    document.getElementById("editName").value =
        student.Student_name || "";

    document.getElementById("editFather").value =
        student.Father_name || "";

    document.getElementById("editMobile").value =
        student.Mobile_number || "";

    document.getElementById("editClass").value =
        student["Student class"] || "";

    document.getElementById("editAddress").value =
        student.Address || "";

    document.getElementById("editModal").style.display =
        "block";
};


function closeEditForm(){

    document.getElementById("editModal").style.display =
        "none";

    currentEditId = null;
}


async function saveStudentEdit(){

    if(!currentEditId) return;

    const name =
        document.getElementById("editName").value.trim();

    const father =
        document.getElementById("editFather").value.trim();

    const mobile =
        document.getElementById("editMobile").value.trim();

    const studentClass =
        document.getElementById("editClass").value.trim();

    const address =
        document.getElementById("editAddress").value.trim();

    if(!name || !father || !mobile || !studentClass){

        alert("Please fill all required fields.");

        return;
    }

    const { error } =
        await supabaseClient
        .from("Student")
        .update({
            Student_name: name,
            Father_name: father,
            Mobile_number: mobile,
            "Student class": studentClass,
            Address: address
        })
        .eq("id", currentEditId);

    if(error){

        alert(
            "Update failed: " +
            error.message
        );

        return;
    }

    alert("Student updated successfully!");

    closeEditForm();

    await loadStudents();
}
   async function updateDueFee(){

    const studentId = document.getElementById("feeStudent").value;
    const feeMonth = document.getElementById("feeMonth").value;

    let monthly = Number(document.getElementById("monthlyFee").value) || 0;
    let previousDue = 0;

    if(studentId && feeMonth){

        const { data, error } = await supabaseClient
            .from("Fees")
            .select("monthly_fee, due_fee, fee_month")
            .eq("student_id", Number(studentId))
            .lt("fee_month", feeMonth)
            .order("fee_month", { ascending: false })
            .limit(1);

        if(!error && data && data.length > 0){

            monthly = Number(data[0].monthly_fee) || monthly;
            previousDue = Number(data[0].due_fee) || 0;

            document.getElementById("monthlyFee").value = monthly;
        }
    }

    document.getElementById("previousDue").value = previousDue;

    const totalPayable = monthly + previousDue;

    document.getElementById("totalPayable").value = totalPayable;

    const paid =
        Number(document.getElementById("amountPaid").value) || 0;

    document.getElementById("dueFee").value =
        Math.max(totalPayable - paid, 0);
}


async function saveFee(){

    const studentId = document.getElementById("feeStudent").value;
    const feeMonth = document.getElementById("feeMonth").value;
    const monthlyFee = Number(document.getElementById("monthlyFee").value) || 0;
const amountPaid = Number(document.getElementById("amountPaid").value) || 0;
const totalPayable = Number(document.getElementById("totalPayable").value) || monthlyFee;
const dueFee = Math.max(totalPayable - amountPaid, 0);
    const paymentDate = document.getElementById("paymentDate").value;

    if(!studentId || !feeMonth || !monthlyFee){
        alert("Please fill Student, Month and Monthly Fee.");
        return;
    }

    const { error } = await supabaseClient
        .from("Fees")
        .insert([{
            student_id: Number(studentId),
            fee_month: feeMonth,
            monthly_fee: monthlyFee,
            amount_paid: amountPaid,
            due_fee: dueFee,
            payment_date: paymentDate || null
        }]);

    if(error){
        alert("Fee save failed: " + error.message);
        return;
    }

    alert("Fee saved successfully!");

   document.getElementById("monthlyFee").value = "";
document.getElementById("amountPaid").value = "0";
document.getElementById("previousDue").value = "0";
document.getElementById("totalPayable").value = "0";
document.getElementById("dueFee").value = "0";
document.getElementById("paymentDate").value = ""; 
}
