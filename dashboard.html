<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Niraj Coaching Classes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:18px;
    text-align:center;
}

header img{
    width:80px;
    height:80px;
    object-fit:contain;
}

header h1{
    margin:8px 0;
    font-size:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:15px;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.search{
    flex:1;
    max-width:500px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 16px;
    cursor:pointer;
    font-size:15px;
}

.refresh{
    background:#1976d2;
    color:white;
}

.logout{
    background:#d32f2f;
    color:white;
}

.container{
    padding:15px;
    max-width:1200px;
    margin:auto;
}

.status{
    margin-bottom:15px;
    font-weight:bold;
}

.table-box{
    background:white;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#e3f2fd;
    color:#0d47a1;
}

.student-photo{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #ccc;
}

.edit{
    background:#388e3c;
    color:white;
}

.delete{
    background:#d32f2f;
    color:white;
    margin-left:5px;
}

.empty{
    text-align:center;
    padding:30px;
}
</style>
</head>

<body>

<header>
    <img src="logo.png" alt="Niraj Coaching Classes">
    <h1>Niraj Coaching Classes</h1>
    <div>Admin Dashboard</div>
</header>

<div class="topbar">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search student name, father name or mobile..."
    >

    <button class="refresh" onclick="loadStudents()">
        Refresh
    </button>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>

<div class="container">

    <div id="status" class="status">
        Loading students...
    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Student Name</th>
                    <th>Father Name</th>
                    <th>Mobile</th>
                    <th>Class</th>
                    <th>Address</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>

        </table>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://licsmghlaxqptmzybavp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZkEeW50";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let students = [];

async function checkLogin(){

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if(!session){

        window.location.href = "login.html";
        return;
    }

    loadStudents();
}


async function loadStudents(){

    const status =
        document.getElementById("status");

    status.textContent =
        "Loading students...";

    const { data, error } =
        await supabaseClient
        .from("Student")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if(error){

        console.error(error);

        status.textContent =
            "Error: " + error.message;

        return;
    }

    students = data || [];

    displayStudents(students);

    status.textContent =
        "Total Students: " + students.length;
}


async function getPhotoUrl(path){

    if(!path) return "";

    const { data, error } =
        await supabaseClient.storage
        .from("student_photos")
        .createSignedUrl(path, 3600);

    if(error){
        console.error(error);
        return "";
    }

    return data.signedUrl;
}


async function displayStudents(list){

    const tbody =
        document.getElementById("studentList");

    tbody.innerHTML = "";

    if(list.length === 0){

        tbody.innerHTML =
        `<tr>
            <td colspan="7" class="empty">
                No students found
            </td>
        </tr>`;

        return;
    }

    for(const student of list){

        const photo =
            await getPhotoUrl(student.Photo_url);

        const tr =
        document.createElement("tr");

        tr.innerHTML = `

            <td>
                ${
                    photo
                    ?
                    `<img
                        src="${photo}"
                        class="student-photo"
                    >`
                    :
                    "No Photo"
                }
            </td>

            <td>${student.Student_name || ""}</td>

            <td>${student.Father_name || ""}</td>

            <td>${student.Mobile_number || ""}</td>

            <td>${student["Student class"] || ""}</td>

            <td>${student.Address || ""}</td>

            <td>

                <button
    class="edit"
    onclick="window.editStudent('${student.id}')">
    Edit
</button>

                <button
                    class="delete"
                    onclick="deleteStudent('${student.id}')">
                    Delete
                </button>

            </td>
        `;

        tbody.appendChild(tr);
    }
}


document
.getElementById("search")
.addEventListener("input", function(){

    const q =
        this.value.toLowerCase().trim();

    const filtered =
        students.filter(s =>

            (s.Student_name || "")
            .toLowerCase()
            .includes(q)

            ||

            (s.Father_name || "")
            .toLowerCase()
            .includes(q)

            ||

            (s.Mobile_number || "")
            .toLowerCase()
            .includes(q)
        );

    displayStudents(filtered);
});


async function editStudent(id){

    const student = students.find(s => s.id === id);

    if(!student) return;

    const name = prompt(
        "Student Name:",
        student.Student_name || ""
    );

    if(name === null) return;

    const father = prompt(
        "Father Name:",
        student.Father_name || ""
    );

    if(father === null) return;

    const mobile = prompt(
        "Mobile Number:",
        student.Mobile_number || ""
    );

    if(mobile === null) return;

    const studentClass = prompt(
        "Class:",
        student["Student class"] || ""
    );

    if(studentClass === null) return;

    const address = prompt(
        "Address:",
        student.Address || ""
    );

    if(address === null) return;

    const { error } = await supabaseClient
        .from("Student")
        .update({
            Student_name: name,
            Father_name: father,
            Mobile_number: mobile,
            "Student class": studentClass,
            Address: address
        })
        .eq("id", id);

    if(error){

        alert(
            "Update failed: " +
            error.message
        );

        return;
    }

    alert("Student updated successfully!");

    loadStudents();
}

async function deleteStudent(id){

    const student =
        students.find(s => s.id === id);

    if(!student) return;

    const confirmDelete =
        confirm(
            "Delete student " +
            (student.Student_name || "") +
            "?"
        );

    if(!confirmDelete) return;

    const { error } =
        await supabaseClient
        .from("Student")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }

    alert("Student deleted successfully!");

    loadStudents();
}


async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";
}


checkLogin();
let currentEditId = null;

window.editStudent = function(id){

    const student = students.find(s => s.id === id);

    if(!student) return;

    currentEditId = id;

    document.getElementById("editName").value =
        student.Student_name || "";

    document.getElementById("editFather").value =
        student.Father_name || "";

    document.getElementById("editMobile").value =
        student.Mobile_number || "";

    document.getElementById("editClass").value =
        student["Student class"] || "";

    document.getElementById("editAddress").value =
        student.Address || "";

    document.getElementById("editModal").style.display =
        "block";
};


function closeEditForm(){

    document.getElementById("editModal").style.display =
        "none";

    currentEditId = null;
}


async function saveStudentEdit(){

    if(!currentEditId) return;

    const name =
        document.getElementById("editName").value.trim();

    const father =
        document.getElementById("editFather").value.trim();

    const mobile =
        document.getElementById("editMobile").value.trim();

    const studentClass =
        document.getElementById("editClass").value.trim();

    const address =
        document.getElementById("editAddress").value.trim();

    if(!name || !father || !mobile || !studentClass){

        alert("Please fill all required fields.");

        return;
    }

    const { error } =
        await supabaseClient
        .from("Student")
        .update({
            Student_name: name,
            Father_name: father,
            Mobile_number: mobile,
            "Student class": studentClass,
            Address: address
        })
        .eq("id", currentEditId);

    if(error){

        alert(
            "Update failed: " +
            error.message
        );

        return;
    }

    alert("Student updated successfully!");

    closeEditForm();

    await loadStudents();
}
</script>
<div id="editModal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:9999;
    padding:20px;
    overflow:auto;
">

    <div style="
        max-width:450px;
        margin:40px auto;
        background:white;
        padding:22px;
        border-radius:12px;
    ">

        <h2 style="text-align:center;color:#0d47a1;">
            Edit Student
        </h2>

        <input id="editName"
            placeholder="Student Name"
            style="width:100%;padding:12px;margin:7px 0;">

        <input id="editFather"
            placeholder="Father Name"
            style="width:100%;padding:12px;margin:7px 0;">

        <input id="editMobile"
            placeholder="Mobile Number"
            style="width:100%;padding:12px;margin:7px 0;">

        <input id="editClass"
            placeholder="Class"
            style="width:100%;padding:12px;margin:7px 0;">

        <textarea id="editAddress"
            placeholder="Address"
            style="width:100%;padding:12px;margin:7px 0;min-height:90px;"></textarea>

        <button onclick="saveStudentEdit()"
            style="
                width:48%;
                padding:12px;
                background:#388e3c;
                color:white;
                border:0;
                border-radius:7px;
            ">
            Save
        </button>

        <button onclick="closeEditForm()"
            style="
                width:48%;
                padding:12px;
                background:#d32f2f;
                color:white;
                border:0;
                border-radius:7px;
            ">
            Cancel
        </button>

    </div>
</div>
</body>
</html>
