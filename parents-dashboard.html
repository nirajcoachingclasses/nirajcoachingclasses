<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parents Dashboard - Niraj Coaching Classes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#12243d;font-family:Arial,sans-serif}.top{background:linear-gradient(135deg,#07152f,#14539a);color:#fff;padding:22px 18px 34px}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.brand small{opacity:.8}.brand h1{margin:5px 0;font-size:25px}.logout{width:auto;height:auto;margin:0;padding:10px 14px;border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:10px;font-weight:bold}.wrap{max-width:1100px;margin:-18px auto 30px;padding:0 16px}.parent{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0f234114;display:flex;justify-content:space-between;gap:20px;align-items:center}.name{font-size:21px;font-weight:bold}.muted{color:#64748b;margin-top:5px}.stats{display:flex;gap:10px}.stat{background:#f4f7fb;border-radius:12px;padding:10px 15px;text-align:center}.stat b{display:block;font-size:20px;color:#0d47a1}h2{font-size:20px;margin:26px 2px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.student{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0f234114}.head{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #edf1f6;padding-bottom:14px}.class{background:#e9f2ff;color:#0d47a1;border-radius:20px;padding:6px 10px;font-weight:bold;height:max-content}.fees{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.fee{background:#f7f9fc;border-radius:10px;padding:10px;text-align:center}.fee span{display:block;color:#64748b;font-size:12px}.fee b{display:block;font-size:17px;margin-top:3px}.history{margin-top:16px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #edf1f6;text-align:left;white-space:nowrap}.empty{text-align:center;background:white;border-radius:16px;padding:25px;color:#64748b}@media(max-width:650px){.topin,.parent{flex-direction:column}.stats{width:100%}.stat{flex:1}}</style></head><body><header class="top"><div class="topin"><div class="brand"><small>NIRAJ COACHING CLASSES</small><h1>Parents Dashboard</h1></div><button class="logout" id="logout">Logout</button></div></header><main class="wrap"><section class="parent"><div><div class="name" id="pn">Loading...</div><div class="muted" id="pm"></div></div><div class="stats"><div class="stat">Children<b id="cc">0</b></div><div class="stat">Total Pending<b id="tp">₹0</b></div></div></section><h2>👨‍👩‍👧‍👦 आपके बच्चे</h2><div id="students" class="grid"><div class="empty">Students load हो रहे हैं...</div></div></main><script>const sb=supabase.createClient('https://licsmghlaxqptmzybavp.supabase.co','sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZKkEeW50');const ru=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let s=await sb.auth.getSession();if(!s.data.session){location.href='parents-login.html';return}let a=await sb.from('parents_portal_accounts').select('id,parent_name,mobile').eq('user_id',s.data.session.user.id).maybeSingle();if(a.error||!a.data){students.innerHTML='<div class="empty">Parent account link नहीं मिला।</div>';return}pn.textContent=a.data.parent_name||'Parent';pm.textContent='Mobile: '+(a.data.mobile||'');let l=await sb.from('parent_portal_students').select('student_id').eq('parent_id',a.data.id);if(l.error){students.innerHTML='<div class="empty">Children load नहीं हो सके।</div>';return}let ids=(l.data||[]).map(x=>String(x.student_id));cc.textContent=ids.length;if(!ids.length){students.innerHTML='<div class="empty">अभी कोई student linked नहीं है।</div>';return}let st=await sb.from('Student').select('id,"Student_name","Father_name","Mobile_number","Student class"').in('id',ids);if(st.error){students.innerHTML='<div class="empty">Student details load नहीं हो सके।</div>';return}let fr=await sb.from('Fees').select('student_id,fee_month,monthly_fee,amount_paid,due_fee').in('student_id',ids).order('fee_month',{ascending:false});let by={};(fr.data||[]).forEach(f=>(by[String(f.student_id)]??=[]).push(f));let total=0;students.innerHTML=(st.data||[]).map(x=>{let fs=by[String(x.id)]||[],pending=fs.reduce((n,f)=>n+Number(f.due_fee||0),0),paid=fs.reduce((n,f)=>n+Number(f.amount_paid||0),0);total+=pending;let monthly=fs[0]?.monthly_fee||0;let rows=fs.slice(0,8).map(f=>`<tr><td>${esc(f.fee_month||'—')}</td><td>${ru(f.monthly_fee)}</td><td>${ru(f.amount_paid)}</td><td>${ru(f.due_fee)}</td></tr>`).join('')||'<tr><td colspan="4">No fee records</td></tr>';return `<article class="student"><div class="head"><div><div class="name">${esc(x.Student_name||'Student')}</div><div class="muted">${esc(x.Father_name||'')}</div></div><span class="class">${esc(x['Student class']||'Class')}</span></div><div class="fees"><div class="fee"><span>Monthly</span><b>${ru(monthly)}</b></div><div class="fee"><span>Paid</span><b>${ru(paid)}</b></div><div class="fee"><span>Pending</span><b>${ru(pending)}</b></div></div><div class="history"><b>Fee History</b><table><thead><tr><th>Month</th><th>Fee</th><th>Paid</th><th>Due</th></tr></thead><tbody>${rows}</tbody></table></div></article>`}).join('');tp.textContent=ru(total)}logout.onclick=async()=>{await sb.auth.signOut();location.href='parents-login.html'};load();</script></body></html>
