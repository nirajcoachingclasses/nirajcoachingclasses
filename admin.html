<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Niraj Coaching Classes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .login-box img {
            width: 120px;
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            color: #0d47a1;
            margin: 5px 0;
            font-size: 25px;
        }

        h2 {
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #0d47a1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #083579;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="logo.png" alt="Niraj Coaching Classes">

    <h1>Niraj Coaching Classes</h1>

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button onclick="adminLogin()">
        Login
    </button>

    <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://licsmghlaxqptmzybavp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZkEeW50";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function adminLogin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if (!email || !password) {

        message.style.color = "red";

        message.textContent =
            "Email और Password भरिए।";

        return;
    }


    message.style.color = "#555";

    message.textContent =
        "Login हो रहा है...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        message.style.color = "red";

        message.textContent =
            "Login failed: " + error.message;

        return;
    }


    message.style.color = "green";

    message.textContent =
        "Login successful!";


    setTimeout(() => {

        window.location.href =
            "admin-dashboard.html";

    }, 800);

}

</script>

</body>
</html>
