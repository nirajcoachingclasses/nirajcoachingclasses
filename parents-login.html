<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parents Login - Niraj Coaching Classes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#07152f,#14539a);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;background:white;border-radius:24px;padding:30px;box-shadow:0 25px 70px #0005}.logo{width:68px;height:68px;border-radius:18px;background:#0d47a1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:auto auto 14px}h1{text-align:center;margin:0;color:#0b2b59}.sub{text-align:center;color:#64748b;margin:8px 0 26px}label{display:block;font-weight:bold;margin:15px 0 7px}input{width:100%;height:50px;border:1px solid #d7dee8;border-radius:12px;padding:0 14px;font-size:16px}button{width:100%;height:52px;border:0;border-radius:12px;background:#176cca;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:22px}.msg{text-align:center;min-height:24px;margin-top:15px}.hint{margin-top:20px;background:#f3f7fc;border-radius:12px;padding:12px;font-size:13px;color:#52657a}.back{display:block;text-align:center;margin-top:18px;color:#176cca;text-decoration:none}</style></head><body><div class="card"><div class="logo">👨‍👩‍👧‍👦</div><h1>Parents Login</h1><div class="sub">Niraj Coaching Classes</div><form id="f"><label>Registered Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number" required><label>Password</label><input id="password" type="password" minlength="8" placeholder="Password" required><button id="btn">Login</button></form><div id="msg" class="msg"></div><div class="hint">एक ही parent mobile number से जुड़े सभी बच्चे login के बाद एक ही Parents Dashboard में दिखाई देंगे।</div><a class="back" href="login.html">← Main Login</a></div><script>const sb=supabase.createClient("https://licsmghlaxqptmzybavp.supabase.co","sb_publishable_lDYQuKhTuj2JEM3SHYrQUw_ZZKkEeW50");function norm(v){let m=String(v||'').replace(/\D/g,'');if(m.startsWith('91')&&m.length===12)m=m.slice(2);if(m.startsWith('0')&&m.length===11)m=m.slice(1);return m}f.addEventListener('submit',async e=>{e.preventDefault();let m=norm(mobile.value),p=password.value;if(!/^\d{10}$/.test(m)){msg.textContent='Sahi 10 digit mobile number daliye.';return}if(p.length<8){msg.textContent='Password kam se kam 8 characters ka hona chahiye.';return}btn.disabled=true;msg.textContent='Login ho raha hai...';let r=await sb.auth.signInWithPassword({email:`parent-${m}@nirajcoachingclasses.example.com`,password:p});if(r.error){msg.textContent='Mobile number ya password galat hai.';btn.disabled=false;return}location.href='parents-dashboard.html'});</script></body></html>
